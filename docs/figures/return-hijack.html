<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="fig.css">
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="668" viewBox="0 0 760 668">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a4a4a8"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6ad60"/></marker>
  </defs>
  <style>
    .h { font-size:19px; font-weight:600; fill:#ededee }
    .s { fill:#a4a4a8; font-size:15.5px }
    .box { fill:#1b1b1d; stroke:#3a3a3e; stroke-width:1.5 }
    .slot { fill:#252527; stroke:#3a3a3e; stroke-width:1.5 }
    .hot { fill:#2a2314; stroke:#d6ad60; stroke-width:2 }
    .m { font-family: ui-monospace,'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace; font-size:15.5px; fill:#ededee }
    .mg { font-family: ui-monospace,'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace; font-size:15.5px; fill:#d6ad60 }
    .mt { font-family: ui-monospace,'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace; font-size:13.5px; fill:#6e6e73 }
    .n { font-size:13px; fill:#6e6e73; letter-spacing:.08em }
  </style>

  <!-- row 1 -->
  <text x="32" y="44" class="n">1 · THE CALL</text>
  <text x="32" y="72" class="h">The return address is</text>
  <text x="32" y="96" class="h">on the stack</text>
  <text x="32" y="128" class="s">vfs_read has just been entered.</text>
  <text x="32" y="150" class="s">Its first instruction calls the hook.</text>
  <text x="400" y="44" class="mt">the stack</text>
  <rect x="400" y="54" width="328" height="44" rx="4" class="slot"/>
  <text x="414" y="82" class="m">return → ksys_read+0x61</text>
  <rect x="400" y="98" width="328" height="44" rx="4" class="box"/>
  <text x="414" y="126" class="mt">ksys_read's frame …</text>
  <line x1="32" y1="186" x2="728" y2="186" stroke="#2a2a2d"/>

  <!-- row 2 -->
  <text x="32" y="228" class="n">2 · THE ENTRY HOOK</text>
  <text x="32" y="256" class="h">The hook swaps the slot</text>
  <text x="32" y="288" class="s">The real address and the time are</text>
  <text x="32" y="310" class="s">saved aside. Then vfs_read runs,</text>
  <text x="32" y="332" class="s">knowing nothing.</text>
  <text x="400" y="222" class="mt">the stack</text>
  <rect x="400" y="232" width="328" height="44" rx="4" class="hot"/>
  <text x="414" y="260" class="mg">return → return_to_handler</text>
  <text x="400" y="308" class="mt">the task's private stack</text>
  <rect x="400" y="318" width="328" height="68" rx="4" class="slot"/>
  <text x="414" y="346" class="m">real return: ksys_read+0x61</text>
  <text x="414" y="372" class="m">entered at:  t₀</text>
  <line x1="32" y1="418" x2="728" y2="418" stroke="#2a2a2d"/>

  <!-- row 3 -->
  <text x="32" y="460" class="n">3 · THE RETURN</text>
  <text x="32" y="488" class="h">ret lands in the tracer</text>
  <text x="32" y="520" class="s">One hook at the entry is enough to</text>
  <text x="32" y="542" class="s">time the whole call: the exit hook is</text>
  <text x="32" y="564" class="s">borrowed from the function's own</text>
  <text x="32" y="586" class="s">return.</text>
  <rect x="400" y="446" width="328" height="40" rx="4" class="box"/>
  <text x="414" y="472" class="m">vfs_read:  …  ret</text>
  <path d="M 564 486 L 564 506" stroke="#d6ad60" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <rect x="400" y="510" width="328" height="88" rx="4" class="hot"/>
  <text x="414" y="536" class="mg">return_to_handler:</text>
  <text x="414" y="560" class="m">  t₁ = now; record t₀ and t₁</text>
  <text x="414" y="584" class="m">  go to the saved address</text>
  <path d="M 564 598 L 564 618" stroke="#a4a4a8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="400" y="622" width="328" height="34" rx="4" class="box"/>
  <text x="414" y="645" class="m">ksys_read+0x61: carries on</text>
</svg>
