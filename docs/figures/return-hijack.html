<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="fig.css">
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" font-size="19">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a4a4a8"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6ad60"/></marker>
  </defs>
  <style>
    .h { font-size:22px; font-weight:600; fill:#ededee }
    .s { fill:#a4a4a8; font-size:17px }
    .box { fill:#1b1b1d; stroke:#3a3a3e; stroke-width:1.5 }
    .slot { fill:#252527; stroke:#3a3a3e; stroke-width:1.5 }
    .hot { fill:#2a2314; stroke:#d6ad60; stroke-width:2 }
    .m { font-family: ui-monospace,'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace; font-size:17px; fill:#ededee }
    .mg { font-family: ui-monospace,'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace; font-size:17px; fill:#d6ad60 }
    .mt { font-family: ui-monospace,'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace; font-size:15px; fill:#6e6e73 }
    .n { font-size:15px; fill:#6e6e73; letter-spacing:.08em }
  </style>

  <!-- panel 1 -->
  <text x="60" y="58" class="n">1 · THE CALL</text>
  <text x="60" y="92" class="h">The caller's return address is on the stack</text>
  <text x="60" y="150" class="mt">the stack</text>
  <rect x="60" y="162" width="380" height="50" rx="4" class="slot"/>
  <text x="78" y="194" class="m">return → ksys_read+0x61</text>
  <rect x="60" y="212" width="380" height="50" rx="4" class="box"/>
  <text x="78" y="244" class="mt">ksys_read's frame …</text>
  <text x="60" y="318" class="s">vfs_read has just been entered. Its first</text>
  <text x="60" y="344" class="s">instruction is the call to the hook.</text>

  <!-- panel 2 -->
  <text x="560" y="58" class="n">2 · THE ENTRY HOOK</text>
  <text x="560" y="92" class="h">The hook swaps the slot</text>
  <text x="560" y="150" class="mt">the stack</text>
  <rect x="560" y="162" width="380" height="50" rx="4" class="hot"/>
  <text x="578" y="194" class="mg">return → return_to_handler</text>
  <rect x="560" y="212" width="380" height="50" rx="4" class="box"/>
  <text x="578" y="244" class="mt">ksys_read's frame …</text>
  <text x="560" y="318" class="mt">the task's private stack</text>
  <rect x="560" y="330" width="380" height="78" rx="4" class="slot"/>
  <text x="578" y="361" class="m">real return: ksys_read+0x61</text>
  <text x="578" y="389" class="m">entered at:  t₀</text>
  <path d="M 500 187 C 520 187, 520 187, 548 187" stroke="#a4a4a8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="560" y="452" class="s">The real address and the time are saved aside.</text>
  <text x="560" y="478" class="s">Then vfs_read runs, knowing nothing.</text>

  <!-- panel 3 -->
  <text x="1060" y="58" class="n">3 · THE RETURN</text>
  <text x="1060" y="92" class="h">ret lands in the tracer</text>
  <rect x="1060" y="162" width="480" height="50" rx="4" class="box"/>
  <text x="1078" y="194" class="m">vfs_read:  …  ret</text>
  <path d="M 1300 212 L 1300 250" stroke="#d6ad60" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <rect x="1060" y="256" width="480" height="134" rx="4" class="hot"/>
  <text x="1078" y="288" class="mg">return_to_handler:</text>
  <text x="1078" y="316" class="m">  t₁ = now</text>
  <text x="1078" y="344" class="m">  record  vfs_read  took  t₁ − t₀</text>
  <text x="1078" y="372" class="m">  jump to the saved address</text>
  <path d="M 1300 390 L 1300 428" stroke="#a4a4a8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="1060" y="434" width="480" height="50" rx="4" class="box"/>
  <text x="1078" y="466" class="m">ksys_read+0x61:  carries on</text>
  <path d="M 1000 187 C 1020 187, 1020 187, 1048 187" stroke="#a4a4a8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <line x1="60" y1="548" x2="1540" y2="548" stroke="#2a2a2d"/>
  <text x="60" y="590" class="s">One hook at the entry of each function is enough to time the whole call: the exit hook is borrowed from the function's own return.</text>
</svg>
